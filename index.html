<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Video Chat</title>
    <link rel="stylesheet" href="style.css">
    <script src="peerjs.min.js"></script>
</head>
<body>
    <div class="app-shell">
        <div id="notification-container" class="notification-container"></div>

        <section id="home-screen" class="home-screen">
            <div class="home-card">
                <p class="eyebrow">Live Video Chat</p>
                <h1>connect and gossip</h1>
                <div class="home-actions">
                    <button id="home-host-btn" class="home-action-btn" type="button">Host a Meeting</button>
                    <button id="home-join-btn" class="home-action-btn ghost-btn" type="button">Join a Meeting</button>
                </div>
                <div id="home-form" class="home-form app-hidden">
                    <div class="field">
                        <label for="home-name-input">Your Name</label>
                        <input type="text" id="home-name-input" placeholder="Let others know your name" maxlength="20">
                    </div>
                    <div class="field app-hidden" id="home-room-field">
                        <label for="home-room-code-input">Room Code</label>
                        <input type="text" id="home-room-code-input" placeholder="Enter 6-digit room code" maxlength="6" inputmode="numeric">
                    </div>
                    <button id="home-start-host-btn" class="home-submit-btn app-hidden" type="button">Create Meeting</button>
                    <button id="home-start-join-btn" class="home-submit-btn app-hidden" type="button">Join Meeting</button>
                </div>
            </div>
        </section>

        <div id="app-content" class="app-content app-hidden">
        <header class="app-header">
            <div class="app-title">
                <p class="eyebrow">Live Video Chat</p>
                <h1>connect and gossip</h1>
                <p id="status-text" class="status-text">Preparing your room...</p>
            </div>
            <div class="top-room-code" id="host-panel">
                <span class="status-pill" id="participant-count">1 participant</span>
                <span class="status-pill" id="connection-state">Starting</span>
                <div class="code-display">
                    <span id="room-code">Generating...</span>
                    <button id="copy-code-btn" class="ghost-btn" type="button" disabled>Copy</button>
                </div>
            </div>
        </header>

        <main class="container">
            <section class="setup-panel">
                <div class="field">
                    <label for="name-input">Your Name</label>
                    <input type="text" id="name-input" placeholder="Enter your name" maxlength="20">
                </div>

                <div class="field" id="join-panel">
                    <label for="join-code">Join a Room</label>
                    <input type="text" id="join-code" placeholder="Enter 6-digit room code" maxlength="6" inputmode="numeric">
                </div>

                <button id="join-btn" type="button">Join Room</button>
            </section>

            <section class="main-content">
                <div class="video-section card">
                    <div class="section-head">
                        <div>
                            <h2>Room</h2>
                            <p>See who is in the call and who has left.</p>
                        </div>
                    </div>
                    <div id="video-grid" class="video-grid"></div>
                    <div class="controls">
                        <button id="mute-btn" type="button">Mute Audio</button>
                        <button id="video-btn" type="button">Turn Off Video</button>
                    </div>
                </div>

                <div class="chat-section card">
                    <div class="section-head">
                        <div>
                            <h2>Chat</h2>
                            <p>Messages stay simple and local for this session.</p>
                        </div>
                    </div>
                    <div id="chat-box" class="chat-box"></div>
                    <div class="chat-input">
                        <input type="text" id="msg-input" placeholder="Type a message..." maxlength="300">
                        <button id="send-btn" type="button">Send</button>
                    </div>
                </div>
            </section>
        </main>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
